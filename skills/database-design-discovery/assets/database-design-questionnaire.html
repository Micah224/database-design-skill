<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Database Design Requirements Questionnaire &mdash; Identity, Roles &amp; Data Governance</title>
<style>
:root{
  --ink:#14161a; --ink2:#3c4350; --ink3:#6b7482; --line:#dfe3ea; --line2:#eef1f5;
  --bg:#f6f7f9; --card:#ffffff; --accent:#1f4ba8; --accent-soft:#eaf0fb;
  --good:#0f7a4d; --good-soft:#e8f5ee; --warn:#a15c00; --warn-soft:#fdf3e2;
  --bad:#a3231f; --bad-soft:#fbecec; --alt:#5b3fa8; --alt-soft:#f0ecfb;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
code,kbd{font-family:var(--mono);font-size:.88em;background:#eef1f5;padding:.1em .35em;border-radius:3px}

/* ---------- shell ---------- */
header.top{background:#11161f;color:#fff;padding:20px 28px;position:sticky;top:0;z-index:40;box-shadow:0 1px 0 rgba(0,0,0,.25)}
header.top h1{margin:0;font-size:18px;letter-spacing:-.01em;font-weight:650}
header.top p{margin:4px 0 0;font-size:12.5px;color:#9aa4b4;max-width:960px}
.topbar-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.topactions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:550;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2f4f8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1a3f8f}
.btn.ghost{background:transparent;border-color:#39414f;color:#cfd6e2}
.btn.ghost:hover{background:#1b2230}
.btn:disabled{opacity:.4;cursor:not-allowed}

.progwrap{height:4px;background:#252c3a;position:relative}
.progbar{height:100%;background:linear-gradient(90deg,#3d7dfa,#6fd3a8);width:0%;transition:width .25s ease}

.layout{display:grid;grid-template-columns:250px 1fr;gap:0;max-width:1320px;margin:0 auto;align-items:start}
nav.side{position:sticky;top:118px;padding:22px 14px 40px 20px;max-height:calc(100vh - 130px);overflow-y:auto}
nav.side h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);margin:0 0 10px 6px}
nav.side ol{list-style:none;margin:0;padding:0}
nav.side li{margin:1px 0}
nav.side button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-size:12.7px;padding:6px 8px;border:0;border-radius:6px;background:transparent;color:var(--ink2);cursor:pointer;line-height:1.3}
nav.side button:hover{background:#eaedf2}
nav.side button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side button.done .dot{background:var(--good);border-color:var(--good)}
nav.side .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid #c3cad6;flex:0 0 auto;background:#fff}
nav.side button.active .dot{border-color:var(--accent)}
nav.side .qn{margin-left:auto;font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

main{padding:24px 28px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px 28px;margin-bottom:18px}
.sec-h{margin:0 0 4px;font-size:21px;letter-spacing:-.015em}
.sec-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700;margin:0 0 6px}
.sec-lede{margin:0 0 4px;color:var(--ink2);font-size:14px;max-width:74ch}

/* ---------- questions ---------- */
.q{padding:20px 0;border-top:1px solid var(--line2)}
.q:first-of-type{border-top:0}
.q-head{display:flex;gap:10px;align-items:baseline}
.q-id{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:0 0 auto;padding-top:2px}
.q-text{font-weight:600;font-size:15.5px;margin:0;letter-spacing:-.005em}
.q-help{margin:5px 0 0 0;font-size:13px;color:var(--ink3);max-width:78ch}
.q-help b{color:var(--ink2);font-weight:600}
.q-meta{font-size:11px;color:var(--ink3);margin-left:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.opts{margin:12px 0 0;display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.opt:hover{border-color:#b9c4d6;background:#fbfcfe}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt input{margin:3px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.opt .lab{font-size:14px;line-height:1.4}
.opt .sub{display:block;font-size:12.2px;color:var(--ink3);margin-top:2px}
.opt.sel .sub{color:#3f5a8a}
.otherbox{margin-top:8px;display:none}
.otherbox.on{display:block}
.otherbox textarea,.otherbox input[type=text]{width:100%;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;resize:vertical;background:#fff}
.otherbox label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);margin-bottom:4px;font-weight:650}
.notebox{margin-top:8px}
.notebox summary{font-size:12px;color:var(--ink3);cursor:pointer;user-select:none}
.notebox textarea{width:100%;font:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-top:6px;min-height:56px}
.q.unanswered.flagged .q-text::after{content:" \2014 not answered";color:var(--bad);font-weight:500;font-size:12.5px}
.q.flagged{background:var(--bad-soft);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:8px}
.inline-warn{margin-top:10px;font-size:12.6px;padding:9px 12px;border-radius:7px;background:var(--warn-soft);border:1px solid #f0d9ae;color:#6d3f00}
.inline-warn b{color:#5a3400}

.navbtns{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line2)}

/* ---------- report ---------- */
.rep-hero{background:#11161f;color:#fff;border-radius:10px;padding:26px 28px;margin-bottom:18px}
.rep-hero h2{margin:0 0 6px;font-size:22px}
.rep-hero p{margin:0;color:#9aa4b4;font-size:13.5px}
.stack-grid{display:grid;gap:14px}
.rec{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.rec-h{display:flex;align-items:center;gap:10px;padding:12px 18px;background:#f8fafc;border-bottom:1px solid var(--line)}
.rec-h .n{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);font-weight:700}
.rec-h h3{margin:0;font-size:15.5px;letter-spacing:-.01em}
.rec-b{padding:16px 18px}
.pill{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 8px;border-radius:999px}
.pill.p{background:var(--good-soft);color:var(--good)}
.pill.a{background:var(--alt-soft);color:var(--alt)}
.pill.t{background:var(--warn-soft);color:var(--warn)}
.rec-row{display:grid;grid-template-columns:104px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--line2)}
.rec-row:first-child{border-top:0;padding-top:0}
.rec-row > .pill{align-self:start;justify-self:start}
.rec-row .v{font-size:14px}
.rec-row .v .hd{font-weight:650;font-size:14.5px;display:block;margin-bottom:2px}
.why{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);font-size:12.6px;color:var(--ink2)}
.why .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);font-weight:700;display:block;margin-bottom:3px}
.why ul{margin:2px 0 0;padding-left:17px}
.why li{margin:2px 0}
.cite{font-size:12.2px;color:var(--ink3);margin-top:8px;padding-left:11px;border-left:2px solid var(--line)}
.cite b{color:var(--ink2);font-weight:600}
.flags{display:grid;gap:9px}
.flag{padding:12px 14px;border-radius:8px;font-size:13.4px;border:1px solid}
.flag.bad{background:var(--bad-soft);border-color:#f0cbc9}
.flag.warn{background:var(--warn-soft);border-color:#f0d9ae}
.flag.info{background:var(--accent-soft);border-color:#cfdcf5}
.flag b{display:block;margin-bottom:2px;font-size:13.4px}
.flag .fix{display:block;margin-top:5px;font-size:12.6px;color:var(--ink2)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.chk li{display:flex;gap:9px;align-items:flex-start;font-size:13.6px;padding:7px 10px;border:1px solid var(--line2);border-radius:6px;background:#fcfdfe}
.chk li .m{font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:0 0 auto;padding-top:2px;min-width:0}
.chk li .d{font-size:12.4px;color:var(--ink3);display:block}
table.ans{width:100%;border-collapse:collapse;font-size:12.8px;margin-top:6px}
table.ans th,table.ans td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line2)}
table.ans th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);border-bottom:1px solid var(--line)}
table.ans td.k{font-family:var(--mono);font-size:11px;color:var(--ink3);white-space:nowrap}
.muted{color:var(--ink3);font-size:12.6px}
.hide{display:none !important}

@media (max-width:920px){
  .layout{grid-template-columns:1fr}
  nav.side{position:static;max-height:none;padding:14px 18px 0;border-bottom:1px solid var(--line)}
  nav.side ol{display:flex;flex-wrap:wrap;gap:4px}
  nav.side li{margin:0}
  nav.side .qn{display:none}
  main{padding:18px 16px 60px}
  .card{padding:20px 18px}
  .rec-row{grid-template-columns:1fr;gap:2px}
}
@media print{
  header.top,nav.side,.navbtns,.topactions,.progwrap,.noprint{display:none !important}
  body{background:#fff;font-size:10.5pt}
  .layout{display:block;max-width:none}
  main{padding:0}
  .card,.rec{border-color:#ccc;break-inside:avoid;page-break-inside:avoid}
  .rep-hero{background:#fff;color:#000;border:2px solid #000}
  .rep-hero p{color:#444}
  .rec{margin-bottom:10px}
}
</style>
</head>
<body>
<header class="top">
  <div class="topbar-row">
    <div>
      <h1>Database Design Requirements Questionnaire</h1>
      <p>Identity &middot; privilege ladder &middot; organisation model &middot; governance &middot; audit. Answer these before you write the first migration. Every recommendation below is derived by a published rule from your answers and carries its source.</p>
    </div>
    <div class="topactions noprint">
      <button class="btn ghost" id="btn-save">Save answers (JSON)</button>
      <button class="btn ghost" id="btn-load">Load answers</button>
      <button class="btn ghost" id="btn-md">Export brief (Markdown)</button>
      <button class="btn primary" id="btn-report">Generate recommendation</button>
    </div>
  </div>
</header>
<div class="progwrap noprint"><div class="progbar" id="progbar"></div></div>
<input type="file" id="file-in" accept="application/json" class="hide">

<div class="layout">
  <nav class="side noprint">
    <h4>Sections</h4>
    <ol id="secnav"></ol>
  </nav>
  <main>
    <div id="quiz"></div>
    <div id="report" class="hide"></div>
  </main>
</div>
<script>
/* =====================================================================
   Database Design Requirements Questionnaire
   Deterministic rule engine. No network calls, no storage APIs, no
   telemetry. Answers live in memory; use Save/Load to persist.
   ===================================================================== */

const SECTIONS = [
  {id:'A', name:'Domain & risk',        lede:'What the system is for, and what happens when it is wrong. Almost every later rule keys off these five answers.'},
  {id:'B', name:'Scale & data shape',   lede:'Volume, shape and access pattern. This section picks the engine; nothing else does.'},
  {id:'C', name:'Identity',             lede:'How a human becomes a row. Identifiers, verification, and whether one human can be several accounts.'},
  {id:'D', name:'Authentication',       lede:'Assurance level, authenticators and recovery. NIST SP 800-63-4 (final, 31 Jul 2025) is the reference throughout.'},
  {id:'E', name:'User account features',lede:'What an account must be able to do on day one. Several of these are legal requirements, not product choices.'},
  {id:'F', name:'Organisation model',   lede:'Departments, branches, regions, legal entities — and whether you must be able to reconstruct them as at a past date.'},
  {id:'G', name:'Staff & roles',        lede:'How a job function becomes a grant, who scopes it, and which duties must never meet in one person.'},
  {id:'H', name:'Admin & super-admin',  lede:'Custom roles, grant ceilings, impersonation, break-glass and recertification.'},
  {id:'I', name:'Authorization model',  lede:'What a permission check actually depends on, and where the decision should be made.'},
  {id:'J', name:'Privacy & compliance', lede:'Regimes, consent evidence, erasure, residency and retention. These become tables, not policies.'},
  {id:'K', name:'Audit & evidence',     lede:'What you must be able to prove after the fact, to whom, and for how long.'},
  {id:'L', name:'Operations & stack',   lede:'Team, hosting, language and budget. This decides ORM, managed-vs-self, and how much of the above you should buy.'},
  {id:'X', name:'Domain specifics',     lede:'Extra questions triggered by the domain you chose in section A. Skipped entirely if none apply.'}
];

/* helper predicates over the answer object A */
const has  = (A,k,v) => Array.isArray(A[k]) ? A[k].includes(v) : A[k]===v;
const anyOf= (A,k,...vs)=> vs.some(v=>has(A,k,v));

const QUESTIONS = [

/* ---------------------------------------------------------------- A */
{id:'A1', s:'A', type:'one', req:true,
 t:'Which best describes what the system is for?',
 help:'Pick the closest. This drives the domain-specific questions in section X and several regulatory rules.',
 opts:[
  {v:'fintech', l:'Financial services — banking, payments, lending, wallets', s:'You hold, move or lend other people’s money.'},
  {v:'health',  l:'Healthcare or clinical', s:'Patient records, care delivery, diagnostics, telehealth.'},
  {v:'b2bsaas', l:'B2B SaaS sold to organisations', s:'Your customers are companies whose employees are your users.'},
  {v:'commerce',l:'Commerce, marketplace or retail', s:'Catalogue, orders, payments, fulfilment, possibly physical stores.'},
  {v:'logistics',l:'Logistics, field service or fleet', s:'Drivers, technicians, warehouses, routes, devices in the field.'},
  {v:'edu',     l:'Education', s:'Schools, universities, training providers, LMS.'},
  {v:'gov',     l:'Government or public sector', s:'Citizen services, licensing, records, statutory duties.'},
  {v:'internal',l:'Internal enterprise tool', s:'Used only by your own staff; no external customers.'},
  {v:'social',  l:'Consumer social, content or community', s:'User-generated content, feeds, messaging, moderation.'},
  {v:'devtool', l:'Developer or infrastructure tooling', s:'APIs, CI, observability, data platforms.'}
 ]},

{id:'A2', s:'A', type:'many', req:true,
 t:'Who will hold accounts in the system?',
 help:'Select every population. Each one you add tends to add an identifier policy, a verification level and a lifecycle.',
 opts:[
  {v:'public',   l:'Members of the general public', s:'Self-registering consumers.'},
  {v:'custstaff',l:'Employees of your business customers', s:'Someone else’s staff — the classic B2B case.'},
  {v:'ownstaff', l:'Your own employees', s:'Internal staff using the same system.'},
  {v:'contract', l:'Contractors, temps or gig workers', s:'Time-boxed, often high-churn.'},
  {v:'partner',  l:'Partners, resellers, franchisees or agents', s:'Third parties acting on customers’ behalf.'},
  {v:'minor',    l:'People under 18', s:'Triggers parental consent and age-assurance rules.'},
  {v:'proxy',    l:'People represented by someone else', s:'Patients with carers, clients with agents, wards with guardians.'},
  {v:'machine',  l:'Machines, services or integrations', s:'API keys, service accounts, webhooks.'},
  {v:'anon',     l:'Unauthenticated / anonymous visitors', s:'Guest checkout, public read, pre-signup activity.'}
 ]},

{id:'A3', s:'A', type:'one', req:true,
 t:'Is the system multi-tenant?',
 help:'“Tenant” means an isolated customer organisation whose data must never mix with another’s. Getting this wrong is the single most expensive schema mistake to reverse.',
 opts:[
  {v:'single',  l:'No — one organisation, one dataset', s:'Internal tools, single-company products.'},
  {v:'shared',  l:'Yes — shared schema, tenant_id on every row', s:'Cheapest to run, hardest to get isolation right.'},
  {v:'schema',  l:'Yes — one schema (or database) per tenant', s:'Strong isolation, painful past a few hundred tenants.'},
  {v:'hybrid',  l:'Hybrid — shared by default, dedicated for large customers', s:'Common end-state; design for it from day one if you expect it.'},
  {v:'unsure',  l:'Not sure yet', s:'Answer honestly — the recommendation changes.'}
 ]},

{id:'A4', s:'A', type:'one', req:true,
 t:'What is the worst realistic consequence of a wrong, lost or leaked record?',
 help:'Answer for the worst single record, not the average one. This sets the assurance floor for the whole design.',
 opts:[
  {v:'money',   l:'Money moves and cannot be recovered', s:'Payments, transfers, payroll, settlement.'},
  {v:'safety',  l:'Someone’s health, liberty or physical safety is at risk', s:'Clinical decisions, safeguarding, lone-worker, dispatch.'},
  {v:'legal',   l:'Regulatory penalty, licence loss or court exposure', s:'Statutory records, licensed activity.'},
  {v:'reput',   l:'Serious reputational or competitive damage', s:'Confidential business data, embargoed information.'},
  {v:'incon',   l:'Inconvenience, recoverable within a day', s:'Preferences, drafts, non-critical content.'}
 ]},

{id:'A5', s:'A', type:'many', req:true,
 t:'Does the system do any of these regulated things?',
 help:'Select all that apply, including “none”. Each of these pulls in a specific, named obligation — not a general “be careful”.',
 opts:[
  {v:'funds', l:'Holds or moves customer funds', s:'E-money, custody, settlement, escrow.'},
  {v:'card',  l:'Touches raw payment-card numbers (PAN)', s:'Only if the PAN enters your systems. Hosted fields / tokenisation means no.'},
  {v:'phi',   l:'Stores health or medical information'},
  {v:'child', l:'Knowingly collects data from children'},
  {v:'bio',   l:'Processes biometrics (face, fingerprint, voice)', s:'Special-category data in most regimes; some US states require separate consent.'},
  {v:'credit',l:'Makes automated credit, insurance or eligibility decisions', s:'Triggers automated-decision and explainability duties.'},
  {v:'gov',   l:'Maintains official or public records', s:'Statutory retention schedules, disclosure regimes.'},
  {v:'crypto',l:'Deals in crypto-assets or virtual currency'},
  {v:'none',  l:'None of the above'}
 ]},

/* ---------------------------------------------------------------- B */
{id:'B1', s:'B', type:'one', req:true,
 t:'How many rows will your largest single table hold 24 months after launch?',
 help:'Estimate the busiest table (usually events, transactions, messages or line items), not the total database. Deliberately over-estimate rather than under.',
 opts:[
  {v:'tiny', l:'Under 1 million'},
  {v:'small',l:'1 – 50 million'},
  {v:'mid',  l:'50 – 500 million'},
  {v:'large',l:'500 million – 5 billion'},
  {v:'huge', l:'Over 5 billion'},
  {v:'unk',  l:'Genuinely unknown', s:'Fine. It will be treated as “small” with a re-check trigger.'}
 ]},

{id:'B2', s:'B', type:'one', req:true,
 t:'What is the read-to-write ratio on the busiest path?',
 opts:[
  {v:'readheavy', l:'Overwhelmingly reads (95%+)', s:'Catalogues, content, dashboards.'},
  {v:'balanced',  l:'Mixed — roughly 70:30 to 50:50'},
  {v:'writeheavy',l:'Write-heavy — ingest dominates', s:'Telemetry, events, tracking, IoT.'},
  {v:'bursty',    l:'Quiet, punctuated by extreme bursts', s:'Ticket sales, results days, paydays, flash sales.'}
 ]},

{id:'B3', s:'B', type:'one', req:true,
 t:'Peak concurrent active users or connections at the busiest minute?',
 help:'Concurrent, not registered. If you are unsure, take your expected daily actives and divide by 20.',
 opts:[
  {v:'p1', l:'Under 100'},
  {v:'p2', l:'100 – 2,000'},
  {v:'p3', l:'2,000 – 20,000'},
  {v:'p4', l:'20,000 – 200,000'},
  {v:'p5', l:'Over 200,000'}
 ]},

{id:'B4', s:'B', type:'one', req:true,
 t:'Does the dominant data have a time axis — is it a stream of dated events?',
 help:'“Time-series” means rows are written in time order, queried by time range, and rarely updated after insert.',
 opts:[
  {v:'dominant', l:'Yes — the main table is an append-only event or transaction log'},
  {v:'secondary',l:'Partly — entities plus a large event/audit stream beside them'},
  {v:'no',       l:'No — mostly mutable entities'}
 ]},

{id:'B5', s:'B', type:'one', req:true,
 t:'How variable is the shape of your records?',
 help:'This is the honest test for “do I need a document store”, and it is answered by variability, not by preference.',
 opts:[
  {v:'fixed',  l:'Fixed and knowable — you can draw the columns today'},
  {v:'mostly', l:'Mostly fixed, plus a handful of optional or customer-specific fields', s:'The overwhelmingly common case.'},
  {v:'percust',l:'Each customer defines their own fields at runtime', s:'Form builders, CRM-style custom objects, EAV pressure.'},
  {v:'poly',   l:'Genuinely polymorphic documents with no stable core', s:'Content ingestion, scraped data, heterogeneous payloads.'}
 ]},

{id:'B6', s:'B', type:'one', req:true,
 t:'Where are your users, physically?',
 opts:[
  {v:'one',    l:'One country'},
  {v:'region', l:'One region (e.g. EU, West Africa, US)'},
  {v:'multi',  l:'Several regions, but latency is not critical'},
  {v:'global', l:'Global, and cross-region latency is a product problem'}
 ]},

{id:'B7', s:'B', type:'one', req:true,
 t:'What kind of search do users need?',
 opts:[
  {v:'none',  l:'None, or exact lookup by id'},
  {v:'prefix',l:'Prefix / substring filtering on a few fields'},
  {v:'fts',   l:'Ranked full-text search over documents or listings'},
  {v:'rich',  l:'Typo tolerance, faceting, synonyms or relevance tuning'},
  {v:'vector',l:'Semantic / vector similarity search', s:'Embeddings, RAG, recommendations.'}
 ]},

{id:'B8', s:'B', type:'one', req:true,
 t:'What analytics do you need over this data?',
 opts:[
  {v:'none', l:'None beyond a few counts'},
  {v:'light',l:'Operational dashboards over recent data', s:'Under ~10M rows scanned per query.'},
  {v:'heavy',l:'Heavy aggregation, cohorts, funnels across the full history'},
  {v:'wh',   l:'A separate warehouse / lakehouse is already planned'}
 ]},

{id:'B9', s:'B', type:'one', req:true,
 t:'What consistency does the core write path require?',
 help:'Be precise. “Eventual is fine” is a correct answer for a feed and a catastrophic one for a balance.',

/* =====================================================================
   Rule engine. Deterministic: the same answers always produce the same
   report. Each recommendation carries the answers that drove it and the
   source that supports it.
   ===================================================================== */
function recommend(A){
  const R=[], F=[], C=[];
  const rec = o => { R.push(o); return o; };
  const flag = (sev,title,body,fix) => F.push({sev,title,body,fix});
  const chk  = (m,d,g) => C.push({m,d,g});
  const q = k => A[k];
  const H = (k,v) => has(A,k,v);
  const ANY = (k,...vs) => anyOf(A,k,...vs);

  /* ---- derived signals -------------------------------------------- */
  const scale     = q('B1')||'unk';
  const bigScale  = ANY('B1','large','huge');
  const midScale  = ANY('B1','mid')||bigScale;
  const strictMoney = H('B9','strict') || H('A4','money') || H('A5','funds') || H('A1','fintech');
  const regulated = !H('A5','none') && (A.A5||[]).length>0;
  const multiTenant = ANY('A3','shared','schema','hybrid');
  const globalUsers = H('B6','global');
  const offline   = H('B10','full');
  const polyShape = H('B5','poly');
  const perCustFields = H('B5','percust');
  const tsDominant = H('B4','dominant');
  const tsAny     = ANY('B4','dominant','secondary');
  const hiConc    = ANY('B3','p4','p5');
  const soloTeam  = ANY('L1','solo','small');
  const scopedPerms = ANY('G3','own','inherit','explicit','object');
  const deepOrg   = ANY('F2','arb','multi');
  const multiHier = H('F2','multi');
  const orgHistory= ANY('F3','hist','future');
  const relAuthz  = H('I1','rel') || H('I1','assign') || H('I3','nested');
  const attrAuthz = H('I1','attr') || H('I1','state') || H('I1','clear') || H('I1','consent');
  const needDeny  = !H('I4','no') && (A.I4!=null);
  const gdprLike  = ANY('J1','gdpr','ndpa','kenya','popia','afother','us');
  const strongAudit = ANY('K3','offbox','crypto');
  const bigAudit  = H('K1','access') || ANY('K2','y6','y7','perm');
  const pciScope  = H('A5','card') || H('E4','pan');

  /* =================================================================
     1. PRIMARY OPERATIONAL DATASTORE
     ================================================================= */
  {
    let p,a,t,why=[];
    const pgDetail = 'One PostgreSQL cluster as the single source of truth for entities, identity, roles and money. Everything else in this report is a sidecar to it, not a replacement for it.';
    if (offline){
      p={n:'PostgreSQL 18 on the server, SQLite on the device',d:'The server holds truth; each client holds a SQLite replica of the subset it is entitled to, and an explicit, versioned sync protocol reconciles them. Conflict resolution is a product decision you must write down before you write code.'};
      a={n:'A sync-first platform (ElectricSQL, PowerSync, or CouchDB/PouchDB)',d:'These ship the replication and conflict machinery so you do not have to.'};
      t='Switch to a sync platform as soon as your hand-rolled conflict resolution exceeds a few hundred lines, or the moment two clients can legitimately edit the same row.';
      why.push('B10: clients must write while offline and reconcile later.');
    } else if (H('L2','serverless')){
      p={n:'A serverless-native managed PostgreSQL (Neon, Aurora Serverless v2, or Cloud SQL/AlloyDB)',d:'Same PostgreSQL, but with connection pooling and scale-to-zero that survive a function-per-request execution model. Put a pooler in front of it and treat connections as the scarce resource.'};
      a={n:'A provider-native store (DynamoDB, Firestore, Cloudflare D1)',d:'Lower operational surface, at the cost of relational integrity and ad-hoc query ability.'};
      t='Move to the provider-native store only if your access patterns are genuinely key-value and you will never need a join, a report or a foreign key. That is rarer than it looks.';
      why.push('L2: a serverless runtime makes connection lifetime, not query speed, the binding constraint.');
    } else if (scale==='tiny' && H('A3','single') && ANY('B3','p1') && !multiTenant && !regulated && H('B6','one')){
      p={n:'PostgreSQL 18',d:pgDetail+' At your size it will feel like overkill for a year and then stop feeling like overkill permanently.'};
      a={n:'SQLite (WAL mode) embedded in the application',d:'Legitimately the right answer for a single-writer, single-node, single-region application with no operational team.'};
      t='SQLite stops being viable the moment you need a second application node writing concurrently, a network-attached filesystem, or per-role row filtering in the database.';
      why.push('B1/B3/A3: single-tenant, under a million rows, under a hundred concurrent users.');
    } else if (polyShape && !strictMoney){
      p={n:'PostgreSQL 18 with jsonb for the variable part',d:'Keep the stable identifiers, foreign keys and money in columns; keep the genuinely variable payload in a jsonb column with a GIN index. You get document flexibility without giving up joins, constraints or transactions.'};
      a={n:'MongoDB',d:'Choose it when the documents have no stable core at all and you will never need to join them.'};
      t='Move to a document database when, after honest modelling, fewer than about 40% of fields are shared across records, and no query ever needs to relate two different record types.';
      why.push('B5: record shape is genuinely polymorphic.');
    } else {
      p={n:'PostgreSQL 18',d:pgDetail};
      if (globalUsers && ANY('L4','a3','a4') && strictMoney){
        a={n:'A distributed SQL engine (CockroachDB, YugabyteDB or Spanner)',d:'Multi-region writes with serialisable isolation, paid for in write latency and operational complexity.'};
        t='Switch when a single write region can no longer meet your latency target in a second region, or when losing writes during a regional outage becomes commercially unacceptable — not before.';
      } else if (bigScale && tsDominant){
        a={n:'PostgreSQL for entities plus ClickHouse for the event stream',d:'Split the workload rather than the database: transactional truth stays relational, the append-only firehose goes columnar.'};
        t='Split when the event table alone passes roughly a billion rows, or when analytical scans start interfering with transactional latency.';
      } else {
        a={n:'A managed MySQL 8.4 LTS',d:'A reasonable alternative only where your team, tooling and hosting are already built around it.'};
        t='Choose MySQL over PostgreSQL only for an existing-expertise or existing-platform reason. There is no capability in this report that MySQL provides and PostgreSQL does not, and several — row-level security, exclusion constraints, ltree, rich index types — run the other way.';
      }
      why.push('Default position: a relational engine with transactions, constraints and row-level security is the only sane place to put identity, roles and money.');
    }
    if (strictMoney) why.push('B9/A4: you told us a wrong or lost record costs real money, so the write path needs real transactions.');
    if (multiTenant) why.push('A3: multi-tenant isolation is far easier to enforce in an engine with row-level security.');
    if (soloTeam) why.push('L1: a small team should run one database well rather than four badly.');
    rec({area:'Primary operational datastore', p, a, t, why, cite:[CITE.pgdocs18, offline?CITE.sqlite:null, polyShape?CITE.mongo:null].filter(Boolean)});
  }

  /* =================================================================
     2. TENANCY AND ISOLATION
     ================================================================= */
  {
    let p,a,t,why=[];
    if (H('A3','single')){
      p={n:'Single dataset, but with an organisational scope column from day one',d:'Even a single-company system needs to say “this record belongs to the Lagos branch”. Add the scope now; adding it to a live schema later is a migration across every table.'};
      a={n:'A tenant_id column anyway',d:'Costs almost nothing today and is the difference between a weekend and a quarter if you ever sell the product to a second organisation.'};
      t='Add tenant_id now if there is any commercial scenario in which a second organisation uses this system.';
      why.push('A3: one organisation only.');
    } else if (H('A3','schema')){
      p={n:'Schema-per-tenant on one cluster',d:'Strong blast-radius isolation and simple per-tenant export and deletion. Route by search_path at connection checkout, never by string-concatenating a schema name into SQL.'};
      a={n:'Shared schema with tenant_id and RESTRICTIVE row-level security',d:'One schema to migrate, one set of indexes, one connection pool.'};
      t='Move to a shared schema when tenant count passes roughly 500–1,000: past that, every migration becomes an N-schema batch job and connection and catalogue overhead start to dominate.';
      why.push('A3: you chose per-tenant schemas.');
    } else {
      p={n:'Shared schema, tenant_id on every tenant-owned row, enforced by RESTRICTIVE row-level security with FORCE',d:'The policy must be RESTRICTIVE so it ANDs with everything else rather than ORing, and the table must have FORCE ROW LEVEL SECURITY or the owning role silently bypasses it. Set the tenant once per transaction and read it in the policy as <code>(SELECT core.current_tenant())</code> so the planner hoists it into an InitPlan.'};
      a={n:'A dedicated database or cluster for named large customers',d:'Same schema, different placement, selected by a tenant-placement lookup at connection time.'};
      t=H('X-B2B1','x100')||H('A3','hybrid')
        ? 'You have already told us to expect a 100× size skew or a hybrid model — build the placement indirection before the first enterprise deal, not during it.'
        : 'Split a tenant out when it exceeds roughly 100× the median size, or when a contract requires physical isolation. Build the placement indirection first so the split is a configuration change.';
      why.push('A3: shared multi-tenancy.');
      why.push('Row-level security is a backstop against application bugs, not a substitute for scoping queries in the application.');
    }
    if (H('A3','unsure')) { why.push('A3 was “not sure” — this is the cheapest reversible default.'); }
    rec({area:'Tenancy and isolation', p, a, t, why, cite:[CITE.pgrls, CITE.supabase]});
    if (multiTenant){
      chk('core.tenant','One row per customer organisation, with lifecycle state and placement.','tenancy');
      chk('tenant_id on every tenant-owned table','Not derivable by join. Denormalised deliberately, so the RLS policy is a single column comparison.','tenancy');
    }
  }

  /* =================================================================
     3. SEARCH
     ================================================================= */
  if (!H('B7','none')){
    let p,a,t,why=[];
    if (H('B7','prefix')){
      p={n:'PostgreSQL B-tree and trigram indexes',d:'<code>pg_trgm</code> with a GIN index handles substring and fuzzy matching; a plain B-tree with <code>text_pattern_ops</code> handles prefixes. No extra infrastructure.'};
      a={n:'A dedicated search engine',d:'Only once relevance ranking, not matching, becomes the requirement.'};
      t='Add a search engine when users start complaining about result order rather than result presence.';
    } else if (H('B7','fts')){
      p={n:'PostgreSQL full-text search (tsvector + GIN), with a generated column',d:'Keep the index in the same transaction as the data so it can never be stale. Good to several million documents with sensible ranking.'};
      a={n:'OpenSearch, Elasticsearch or Typesense fed by change data capture',d:'Better relevance tooling, at the cost of a second store that can and will drift.'};
      t='Move out of PostgreSQL when the corpus passes roughly five million documents, or when you need synonyms, per-tenant relevance tuning, or faceting on more than a couple of dimensions.';
    } else if (H('B7','rich')){
      p={n:'A dedicated search engine (Typesense or Meilisearch for smaller corpora, OpenSearch or Elasticsearch for larger)',d:'Typo tolerance, faceting and synonyms are what these exist for; reimplementing them in SQL is a multi-quarter mistake.'};
      a={n:'PostgreSQL full-text search plus pg_trgm',d:'Viable if the corpus is small and the relevance requirements turn out to be softer than stated.'};
      t='Stay in PostgreSQL if the corpus is under a few hundred thousand documents and “good enough ordering” is genuinely acceptable — one fewer store to keep in sync is worth a lot.';
      why.push('Whatever you choose, PostgreSQL remains the source of truth and the index is rebuildable from it. Never let the search engine hold data that exists nowhere else.');
    } else {
      p={n:'pgvector inside PostgreSQL, with an HNSW index',d:'Keeps embeddings next to the rows they describe, so filtering by tenant, permission or date is an ordinary WHERE clause rather than a post-filter.'};
      a={n:'A dedicated vector store (Qdrant, Weaviate, Milvus or a managed equivalent)',d:'Higher recall at high queries-per-second and far larger indexes.'};
      t='Move out when you pass roughly 10–50 million vectors, or when filtered nearest-neighbour queries at high throughput stop meeting latency — pre-filtering in SQL is exactly where pgvector wins, and high-QPS unfiltered ANN is where it loses.';
    }

  /* =================================================================

  {
    let p,a,t,why=[];

    if (wantPhish || strictMoney || H('A4','safety')){
      p={n:'Passkeys as the primary factor, with device-bound passkeys or security keys for administrators',d:'A WebAuthn credential is bound to the origin, so a convincing replica of your login page cannot use it. Enrol two authenticators at registration and make the second one the recovery path.'};

    } else {
      p={n:'Password plus a second factor, with passkeys offered as an upgrade',d:'Password rules per the current NIST guidance: a 15-character minimum where the password is the only factor (8 minimum when combined with another factor), no composition rules, no forced rotation except on evidence of compromise, screening against known-breached passwords, and password managers and autofill explicitly permitted.'};

      t='Go passkey-first as soon as your platform mix supports it — the cost of adding it later is mostly migration communication, not engineering.';

    }
    if (H('D3','pksync') && H('D2','aal3')){
      why.push('You asked for AAL3 for administrators but selected synced passkeys. A synced credential can leave the device it was created on, so it cannot meet AAL3; administrators need device-bound authenticators.');
    }
    why.push('Schema consequence: authenticators are rows, not columns. Each row carries its own type, its own creation and last-used timestamps, its own failure counter, and for WebAuthn a credential id of up to 1023 bytes, a COSE public key, a signature counter, a transport list, an AAGUID, and the backup-eligible and backup-state flags. Backup eligibility is fixed for the life of the credential; backup state changes.');
    why.push('Rate limiting is scoped to the authenticator, not to the whole account: the guidance requires limiting consecutive failed attempts using a specific authenticator on a single subscriber account to no more than 100. Counting failures across the account instead hands any attacker a free lockout weapon against your users.');
    rec({area:'Authenticators and assurance', p, a, t, why, cite:[CITE.nist63b, CITE.webauthn, CITE.cf22, CITE.google19, CITE.cisa].concat(H('D3','sms')?[CITE.fbic3]:[])});

    chk('core.authenticator','One row per credential per person. Never a single mfa_secret column. Include the WebAuthn credential record fields and a per-row failure counter.','identity');

  }

     9. ACCOUNT RECOVERY
     ================================================================= */
  {

  /* =================================================================
     10. AUTHORIZATION MODEL

  {
    let p,a,t,why=[];
    const inputs = (A.I1||[]).length;
    if (relAuthz && (H('I2','both')||H('I2','audit')||H('I3','nested'))){
      p={n:'Relationship-based access control, Zanzibar-style',d:'Model access as tuples — <i>this subject has this relation to this object</i> — and let relations compose through the object graph. This is what makes nested folders, shared documents and care-team access tractable, and it answers both “who can see this?” and “what can they see?” from the same index. OpenFGA (a CNCF Incubating project since October 2025) and SpiceDB are the mature open implementations.'};
      a={n:'A closure table in PostgreSQL, plus row-level security',d:'A materialised ancestor table with row-level security gives you the same answers without a second system, as long as the sharing graph stays shallow and your write rate is modest.'};
      t='Stay in PostgreSQL while the sharing graph is a tree you control. Move to a dedicated system when arbitrary users can share arbitrary objects with arbitrary groups — the closure table stops being maintainable at that point. Note that in the published Zanzibar figures the write path is the expensive one: check latency around 3 ms at the median, but write latency around 127 ms.';
      why.push('I1/I3: access depends on the requester’s relationship to the specific record, or on nested containers that inherit access.');
    } else if (attrAuthz && inputs>2){
      p={n:'Role-based access control as the backbone, with a policy engine for the conditions',d:'Roles answer “what kind of thing may this person do”; policy answers “under what circumstances”. Keep them separate: a role called <code>refund_approver_under_500_weekdays_lagos</code> is the classic symptom of collapsing conditions into role names. Cedar, OPA/Rego and Cerbos are the mature choices; Cedar is worth a close look because deny always overrides permit regardless of policy order.'};
      a={n:'Conditions stored as data on the grant itself',d:'Attach a JSON condition to each role-permission row and evaluate it in the application. Fewer moving parts; less expressive, and harder to review as a body of rules.'};
      t='Introduce a policy engine when your conditions need to be reviewed and changed by someone who is not deploying the application, or when the same condition must be enforced by more than one service. Below that, conditions-as-data is genuinely simpler.';
      why.push('I1: a decision depends on more than role and unit — you selected '+inputs+' distinct kinds of input.');
      why.push('The standard warning about attribute-only models is that they make forward checks easy and reverse checks expensive: working out who can access something requires substantial retrieval and computation, because there is no index of grants to read.');
    } else if (scopedPerms || deepOrg){
      p={n:'Hierarchical role-based access control with scoped assignments',d:'The grant is not <i>(person, role)</i>. It is <i>(person, role, scope node, inheritable, valid period)</i>. One row says “branch manager, Lagos region, inherited downward, from 1 March”. That single shape removes the need for a role per branch, which is where role explosion actually comes from.'};
      a={n:'Flat role-based access control plus an explicit unit filter in every query',d:'Simpler to implement and easy to get subtly wrong: the filter is applied in 200 places and forgotten in three.'};
      t='If you take the flat route, enforce the unit filter in the database with row-level security as well, so a forgotten WHERE clause is a returned-nothing bug rather than a cross-branch data leak.';
      why.push('G3: permissions are scoped to '+({own:'the person’s own unit',inherit:'their unit and everything beneath it',explicit:'an explicit list of units',object:'individual records'})[q('G3')]+'.');
      why.push('The permission space in the standard model is 2^(operations × objects), which is precisely why a permission is two columns — an action and a resource type — rather than a string enum you extend by hand.');
    } else {
      p={n:'Core role-based access control',d:'Users get roles, roles hold permissions, and the check is a set-membership test. With a small number of job functions and no scoping, this is correct and anything more is over-engineering.'};
      a={n:'Scoped assignments (person, role, scope, period)',d:'Costs a few extra columns now and saves a rewrite later.'};
      t='Adopt the scoped shape the first time someone says “but only for their own branch”, “only until Friday”, or “only while they are covering”. That request always arrives.';
      why.push('G1/G3: a small number of job functions, applied globally.');
    }
    if (needDeny){
      why.push('I4: you need explicit denies. The role-based standard defines no negative permissions, so denies must sit in a separate layer where deny unconditionally overrides allow and ordering is irrelevant. Never implement them as ordered rules — the eight combining algorithms in XACML exist because ordered rules are genuinely hard to reason about.');
    }
    if (H('I5','sub1')){

    }
    rec({area:'Authorization model', p, a, t, why, cite:[CITE.rbac, CITE.nist162, relAuthz?CITE.zanzibar:null, attrAuthz?CITE.cedar:null, needDeny?CITE.xacml:null, relAuthz?CITE.openfga:null].filter(Boolean)});

    chk('core.permission','A registry of (action, resource_type) with a stable key, a human description, and a flag for whether the permission is dangerous. Not a string enum in code.','authz');
    chk('core.role','tenant_id NULL means a system role. A custom role records the base role it derives from, so shipped roles can be improved without rewriting every customer’s copy.','authz');
    chk('core.role_assignment','(principal, role, scope node, inheritable, validity period) plus who granted it, why, and under what approval.','authz');
    if (needDeny) chk('core.deny_rule','Separate from grants, evaluated last, unconditional. Carries a reason and an expiry.','authz');
    if (ANY('G5','maker','iam','refund','publish','vendor','stock','clinical','grade')) chk('core.sod_constraint','Named conflicting role pairs, with an exception table that records who approved each documented breach and until when.','authz');
  }

  /* =================================================================
     11. ORGANISATION MODEL

  if (!H('F1','none')){

      t='The published benchmark on roughly 264,000 descendants puts recursive adjacency at about 2,080 ms, ltree at about 512 ms and an integer-array materialised path at about 378 ms. Below a few thousand nodes the recursive query is fine; above that the materialised path pays for itself immediately.';
    } else {

    chk('core.org_node / core.org_edge','Nodes carry a type, a jurisdiction and an operating period. Edges carry the hierarchy they belong to and their own validity period.','org');
    if (orgHistory) chk('Validity periods on every assignment','tstzrange plus an exclusion constraint. “Current” becomes a view, not a table.','org');
    if (H('F4','primary')) chk('Exactly-one-primary constraint','EXCLUDE USING GIST (staff_id WITH =, valid WITH &&) WHERE (relation = \'primary\').','org');

  /* =================================================================

  {

      p={n:'Custom roles as “a shipped role, plus and minus named permissions”',d:'Store the base role and an explicit delta rather than a flat copy of the permission set. When you add a permission to a shipped role, every derived role inherits it; with flat copies, every customer’s role silently falls behind and you can never tell which deviations were deliberate.'};

      p={n:'A fixed set of shipped roles, with the permission registry built anyway',d:'Ship the roles you have decided on, but store permissions as rows from day one. The registry costs one table now; retrofitting it means touching every authorization call site later.'};

    }

  {
    let p,a,t,why=[];
    if (strongAudit){
      p={n:'Structured application-level audit events, written in the same transaction, then shipped off-box',d:'Two layers. In-database events give you transactional consistency — an action and its audit record commit or fail together. Shipping them to separately controlled storage, under a different set of credentials, is the only layer that resists a privileged insider.'};
      a={n:'Database triggers capturing row changes',d:'Catches writes that bypass the application, including manual fixes at a psql prompt. Useful as a safety net; poor as a primary record, because a trigger sees column values and not intent.'};
      t='Use both, for different questions. Application events answer “who approved this refund and why”; row triggers answer “what changed in this table at 03:00 during the incident”. Neither answers the other.';
      why.push('K3: the trail must resist privileged insiders. In PostgreSQL an append-only trigger does not achieve that — the documentation is explicit that a table owner is always treated as holding all grant options, so a sufficiently privileged account can drop the trigger. Off-box shipping to storage with different credentials is the control that actually holds, and it is what the audit-record-backup control in the federal catalogue asks for.');
    } else {
      p={n:'Structured application-level audit events, written in the same transaction as the action',d:'The event carries who, what, when, where from, and to what outcome. Write it inside the transaction so an audit record can never describe an action that was rolled back, and never be missing for one that committed.'};
      a={n:'A background audit stream',d:'Cheaper on the write path, and it will eventually disagree with reality.'};
      t='Move audit writes out of the transaction only when they measurably hurt the hot path, and only with an outbox pattern that preserves the guarantee.';
    }
    if (H('K1','change')){
      why.push('You need before-and-after values on changes. A word of warning about the obvious approach: there is currently no generally maintained generic row-audit extension for PostgreSQL — the widely referenced ones are archived, unreleased since 2022, or explicitly closed to contributions. If you write your own trigger, capture only the changed columns as a delta rather than whole row images, and partition the result. A published account from one engineering team describes a generic audit table that grew to billions of rows and roughly half the database while over 90% of queries touched only the last thirty days.');
    }
    if (H('K1','access')){
      why.push('K1: you need to log reads of sensitive records. This is by far the most expensive audit requirement — read volume is typically one to two orders of magnitude above write volume. Log reads at the level of the query intent, not per row returned, and partition aggressively.');
    }
    if (pciScope) why.push('Card-data scope brings a mandated field list for every audit record: user identification, event type, date and time, success or failure indication, origination of event, and identity or name of affected data, system component, resource or service. Model those as columns, not as a free-text message.');
    why.push('Retention: '+({d90:'90 days',y1:'12 months with 3 immediately available'+(pciScope||H('J1','pci')?' — the card-industry rule':''),y6:'6 years'+(H('J1','hipaa')?' — the HIPAA documentation rule':''),y7:'7–10 years',perm:'indefinite'})[q('K2')||'y1']+'. Partition by time so expiry is a partition drop, and separate "immediately searchable" from "retrievable within a day" — they are different storage tiers and pretending otherwise is what makes long retention expensive.');
    rec({area:'Audit architecture', p, a, t, why, cite:[CITE.nist53, CITE.pgpriv, pciScope?CITE.pcidss:null, ANY('K2','y6')?CITE.hipaa:null, H('K1','change')?CITE.supaaudit:null, H('K1','change')?CITE.aha:null, strongAudit?CITE.qldb:null].filter(Boolean)});

    chk('audit.event','Partitioned by time. Actor, on-behalf-of actor, action, resource type and id, outcome, source address, request id, tenant, and the assurance level of the session that did it.','audit');
    if (H('K1','perm')) chk('Grant history that survives revocation','A revoked grant must remain visible as a historical fact. Deleting the row destroys the only evidence that the access ever existed.','audit');
    if (H('K4','routine')||H('K4','contract')) chk('Point-in-time access query','You must be able to run “who held permission P over scope S on date D, and who approved it”. Write that query now and keep it as a test — it is the fastest way to discover that your schema cannot answer it.','audit');

  if (gdprLike || ANY('J1','hipaa','pci','soc2','iso','sector')){
    let p,a,t,why=[];
    if (ANY('J2','purpose','versioned')){
      p={n:'Consent as an append-only event log, per purpose, tied to the exact notice version shown',d:'Store the purpose, the notice version, a hash of the text actually presented, the timestamp, the mechanism, and the source. Current state is a view over the latest event per purpose. A boolean column cannot demonstrate anything, and demonstrating is the legal requirement.'};
      a={n:'A current-state consent table with a separate history table',d:'Two tables that can disagree. Workable, but the log-plus-view shape is strictly better and no harder.'};
      t='If you must keep a current-state table for query speed, generate it from the log rather than writing to both — dual writes drift, and the drift is always discovered during an investigation.';
      why.push('The controller must be able to demonstrate that the data subject consented, and withdrawal must be as easy as giving consent. “As easy” is a design constraint on your interface as much as your schema.');
    } else {
      p={n:'Record your lawful basis per processing purpose, even where consent is not the basis',d:'A purpose registry with a basis, a retention period and an owner. It is the table that makes retention automatable instead of aspirational.'};
      a={n:'Documented outside the database',d:'Then nothing enforces it, and every retention question becomes an archaeology exercise.'};
      t='Put it in the database the moment more than one person can create a new processing purpose.';
    }
    if (ANY('J3','anon','crypto','hard')){
      why.push('J3: erasure is required. Erasure and retention will collide — you told us records must be kept for '+({short:'as short a time as possible',y1:'about a year',y6:'5–7 years',y10:'10 or more years',perm:'permanently',mixed:'different periods by class'})[q('J5')||'mixed']+'. Resolve it by classifying every table into retention classes: discretionary data is deleted, contractually required data is retained until the contract clock expires, data held for legal claims is retained until that clock expires, audit data is pseudonymised rather than deleted, and the erasure itself is recorded in a tombstone that proves the request was honoured without re-identifying anyone.');
    }
    if (H('J3','crypto')){
      why.push('You selected crypto-shredding. Destroying the key is recognised as a purge technique for encrypted media in the federal sanitisation guidance, but no EU or UK regulator has endorsed key destruction on its own as satisfying the right to erasure. Treat it as a strong technical measure and a defensible position, not as a settled legal answer — and keep a written rationale.');
    }
    if (H('J4','law')||H('J4','contract')){
      why.push('J4: residency. Worth knowing that among the regimes commonly cited for localisation, none of the ones surveyed here impose a blanket in-country storage mandate for ordinary personal data — Kenya’s statute contains a power to prescribe local storage that has not been exercised generally. Most residency requirements you will meet are contractual rather than statutory, which changes what you must build: a region column and a placement rule, not a separate legal entity.');
    }
    const clocks = [];
    if (H('J1','ndpa')) clocks.push('Nigeria: 72 hours to the Commission, and — reported, but not verified against the primary text in this research pass — notification to affected data subjects <b>immediately</b> where the risk is high. Confirm with the Commission before designing to it');
    if (H('J1','gdpr')) clocks.push('EU/UK: 72 hours to the supervisory authority; without undue delay to subjects where risk is high');
    if (H('J1','kenya')) clocks.push('Kenya: 72 hours to the Data Commissioner where feasible');
    if (H('J1','popia')) clocks.push('South Africa: as soon as reasonably possible after discovery');
    if (H('J1','hipaa')) clocks.push('HIPAA: individual notice without unreasonable delay, no later than 60 days');
    if (clocks.length>1) why.push('You are subject to more than one breach clock. They are not the same and you cannot run to the slowest: '+clocks.join('; ')+'. Store per-regime deadlines against each breach record, with the decision rationale for each notification made or withheld.');
    else if (clocks.length===1) why.push('Breach clock: '+clocks[0]+'. Store the deadline against the breach record along with the rationale for each decision.');
    rec({area:'Privacy, consent and retention', p, a, t, why, cite:[CITE.gdpr7, CITE.gdpr17, H('J1','ndpa')?CITE.ndpa:null, H('J1','gdpr')?CITE.gdpr33:null, H('J1','kenya')?CITE.kenya:null, H('J1','popia')?CITE.popia:null, H('J1','hipaa')?CITE.hipaabreach:null, H('J3','crypto')?CITE.nist88:null].filter(Boolean)});

    chk('privacy.purpose + privacy.notice','Versioned notices with a content hash; purposes with a lawful basis, a retention period and a named owner.','privacy');
    if (ANY('J2','purpose','versioned')) chk('privacy.consent_event','Append-only. Purpose, notice version, presented hash, mechanism, timestamp, source. Current state is a view.','privacy');
    if (!H('J3','no')) chk('privacy.subject_request + privacy.erasure_tombstone','The request, its statutory deadline and its outcome; and proof that an erasure happened without retaining what was erased.','privacy');
    chk('Retention class on every table','Partition or tag by retention class so expiry is executable rather than aspirational.','privacy');
    if (H('J8','share')||H('J8','many')) chk('privacy.processor / recipient register','Who receives what, under what basis, in which country, and with what safeguard.','privacy');
  }

  {

      p={n:'Managed PostgreSQL with synchronous replication to a standby in a second availability zone, plus continuous archiving for point-in-time recovery',d:'Synchronous replication protects against data loss; point-in-time recovery protects against the far more common failure, which is a correct system faithfully executing a wrong statement.'};
      a={n:'Asynchronous replication with a short, measured replication lag',d:'Lower write latency, at the cost of a bounded amount of data loss on failover.'};

    if (ANY('X-GOV2','foi','open')) { add('Publication classification on the record','Decided at creation, not at request time'+(H('X-GOV2','open')?'; open-data records carry the licence they are published under':'')+'.','privacy'); }
    // --- social
    if (ANY('X-SOC1','team','comm')) { add('Moderation powers as scoped grants','Moderators hold roles scoped to a community/space node'+(H('X-SOC1','comm')?' — community moderators are relationship-scoped, not global':'')+'; every moderation action is an audit event with the content id.','authz',CITE.rbac); }
    // --- staff operating conditions (G6–G9)
    if (H('G6','soft')) { add('Out-of-hours access flag on audit events','Roster window on the staff assignment; access outside it is allowed, alerted and reviewed rather than blocked.','audit'); }
    if (H('G6','hard')) { add('Roster window enforced in the permission check','effective_permissions() joins the staff assignment’s roster window; outside it, no permissions. Provide an emergency override via break-glass.','authz'); }
    if (H('G7','pin')) { add('Device session table + fast re-auth credential','A durable device session and a per-human PIN/badge authenticator (type = pin) with its own failure counter; sensitive actions re-authenticate the human.','identity',CITE.shopify); }
    if (ANY('G8','cached','queue')) { add('Permissions version + max staleness on cached decision sets','Ship tenant_permissions_version with the cached set; enforce a maximum age; re-check dangerous actions online'+(H('G8','queue')?'. Offline-captured work carries the device session id and the permissions version it was authorised under':'')+'.','authz',CITE.zanzibar); }
    if (ANY('G9','date','sponsor')) { add('Mandatory end date on contractor/partner grants'+(H('G9','sponsor')?' + sponsor re-attestation':''),'valid upper bound NOT NULL for contractor principals, enforced at grant time'+(H('G9','sponsor')?'; sponsor_id required and a scheduled review campaign per sponsor':'')+'.','authz',CITE.nist53); }
    const domainChecks = C.filter(c=>['audit','authz','identity','privacy','org','tenancy'].includes(c.g)).length;
    if (why.length || cites.length) {
      rec({area:'Domain-specific requirements',
        p:{n:'Model the domain facts as tables with periods, not as flags or role names',d:'Section X and the staff operating-condition answers do not change the engine or the authorization model; they change what the schema must contain. The checklist below carries each as a concrete table or constraint.'},
        a:{n:'Defer them to application logic',d:'Faster to ship and invisible to auditors; every one of these has been the subject of an incident somewhere.'},
        t:'Put a domain fact in the schema the moment more than one code path needs to agree on it — a limit, a licence expiry, a care relationship, a roster window.',
        why: why.length?why:['Domain answers produced checklist items; see section 3 of this brief.'], cite: cites.length?cites:[CITE.silver]});
    }
  }

  /* =================================================================
     CONTRADICTION AND RISK FLAGS
     These fire on combinations of answers, not on single answers.
     ================================================================= */

  if (ANY('D1','aal2','aal2p','aal3') && ANY('D4','emaillink','sms'))
    flag('bad','Your recovery path is weaker than your login path',
      'You require multi-factor authentication to sign in, but a single emailed or texted message is enough to take the account over. An attacker will always choose the weaker route, so your effective assurance level is the recovery path, not the login screen.',
      'Require a second registered authenticator for recovery, or at minimum re-verify to the same strength that was used at registration. The guidance is explicit that email is not a valid out-of-band authentication channel.');

  if (H('D3','emailotp') && H('C1','email'))
    flag('bad','Email codes to the account that <i>is</i> the login handle',
      'The login handle is an email address and one of the factors is a code sent to that same address. That is one factor wearing two hats: anyone who reaches the inbox has everything.',
      'Use email links for enrolment and verification, not for authentication. The current guidance states that email SHALL NOT be used for out-of-band authentication.');

  if (H('D3','sms') && (H('A4','money')||H('A5','funds')))
    flag('warn','SMS as a factor on a system that moves money',
      'SIM swapping is the standard attack against exactly this configuration, and account-takeover losses tracked through the FBI’s complaint centre are dominated by it. NIST classifies the public telephone network as a restricted channel for this reason.',
      'Keep SMS as a last-resort fallback only, never as sufficient authorisation for a payment, a payout-detail change or a limit change. Require a phishing-resistant factor for those actions.');

  if (H('D2','same') && (H('A4','money')||H('A4','safety')||regulated))
    flag('warn','Administrators authenticate no more strongly than end users',
      'The accounts that can see everything are protected exactly as well as the accounts that can see one record.',
      'Set a separate, higher assurance level for privileged access and a shorter session. The current guidance puts the overall reauthentication timeout at no more than 24 hours at AAL2 (SHOULD, with a 1-hour inactivity timeout) and no more than 12 hours at AAL3 (SHALL, with a 15-minute inactivity timeout).');

  if (H('D6','same'))
    flag('warn','Administrative sessions last as long as ordinary ones',
      'A privileged session left open on an unattended laptop is the cheapest attack there is.',
      'Cap the administrative session at 12–24 hours absolute with a 15–60 minute idle timeout, and force re-authentication before any dangerous action rather than only at sign-in.');

  if (H('J3','hard') && ANY('J5','y6','y10','perm'))
    flag('bad','Hard deletion contradicts your retention obligation',
      'You have committed to destroying rows on request while also being required to keep records for years. One of these will be breached, and you will not get to choose which.',
      'Replace hard deletion with irreversible anonymisation for retained classes: sever the link to the person, keep the record. Classify every table by retention driver so the rule is executable rather than a matter of judgement at request time.');

  if (H('J3','no') && gdprLike)
    flag('bad','You are subject to a regime with erasure rights but have no deletion path',
      'A data subject request will arrive and there will be no mechanism to answer it within the statutory window.',
      'Build the request table and the erasure path now. Deciding what “deleted” means per table is the work; the code is small once that decision exists.');

  if (H('J1','none') && (H('C8','health')||H('C8','bio')||H('C8','ethnic')||H('C8','fin')))
    flag('bad','You are storing special-category data but believe no regime applies',
      'Health, biometric, financial and ethnicity data attract heightened obligations almost everywhere they are processed, and the applicable regime follows the data subject, not your registered office.',
      'Establish which regimes apply to each user population before you design the schema. It changes retention, consent evidence, breach clocks and residency.');

  if (H('H3','person') && !H('H5','none') && (A.H5||[]).length)
    flag('warn','A standing super-administrator defeats your own approval rules',
      'You require a second approver for some actions while also keeping an account that can do anything. Whoever holds that account is a single point of both failure and compromise.',
      'Convert the super-administrator into a break-glass role that must be assumed, is time-boxed, alerts on assumption, and is reviewed afterwards. No standing total power.');

  if (H('H2','any') && ANY('G5','maker','iam','refund','publish','vendor','stock','clinical','grade'))
    flag('bad','Separation of duties cannot hold if any administrator can grant any role',
      'Any administrator can grant themselves the other half of a separated duty in one click, and the audit trail will show a legitimate grant followed by a legitimate action.',
      'Add a grant ceiling — an administrator may only grant what they hold, or only roles explicitly listed as grantable — and check separation constraints at grant time, not only at review time.');

  if (H('H4','unrestricted'))
    flag('warn','Impersonation with no ceremony',
      'Actions taken while impersonating are indistinguishable from actions taken by the user. When a customer disputes something, you will have no way to answer.',
      'Require a reason, cap the session, log to both the audit trail and the user’s own security log, and notify the user without an option to suppress it. That combination is the established pattern.');

  if (!ANY('H4','no','readonly') && !H('K1','imperson'))
    flag('warn','Impersonation is enabled but not separately audited',
      'A single actor column cannot distinguish “the user did this” from “support did this as the user”.',
      'Add a second actor column to every audited event and record the impersonation session id alongside it.');

  if (H('B9','eventual') && (H('A4','money')||H('A5','funds')))
    flag('bad','Eventual consistency on a path that moves money',
      'Double-spend, duplicated payouts and lost updates are the normal outcome, and they surface as reconciliation breaks weeks later rather than as errors at the time.',
      'Keep the money path strictly transactional in a single-writer engine. Use eventual consistency for derived views and read models only.');

  if (H('X-FIN1','balance'))
    flag('bad','A mutable balance column is not an accounting system',
      'Overwriting a balance destroys the only evidence of how it got there. You cannot reconcile, you cannot answer a dispute, and you cannot reconstruct a position as at a past date.',
      'Use an immutable double-entry ledger and derive balances, optionally materialising them for speed. Every movement is two entries and no entry is ever updated.');

  if (H('L8','auto') && !H('L10','weeks'))
    flag('warn','Automatic schema synchronisation is not a migration strategy',
      'It cannot express a backfill, a rename, a concurrent index build, or a rollback — and it will happily drop a column in production.',
      'Move to reviewed migration files with an explicit rollback path before your first production deployment.');

  if (H('I5','sub1') && H('I6','svc'))
    flag('bad','A network policy service cannot meet a sub-millisecond budget',
      'One network round trip alone exceeds your stated budget, before the policy is evaluated.',
      'Either evaluate in-process against a locally cached, version-stamped decision set, or push the decision into the database as a row filter. Keep the policy service for management and distribution, not for the hot path.');

  if (needDeny && !relAuthz && !attrAuthz && ANY('G1','r1','r2') && H('G3','global'))
    flag('info','You need denies, but you have chosen the one model that has none',
      'The role-based standard defines no negative permissions. Denies bolted onto a pure role model as ordered rules become unreviewable quickly.',
      'Keep grants purely additive and put denies in a separate, last-evaluated layer where deny always wins and order never matters.');

  if (H('K3','append') && (H('K4','routine')||H('K4','contract')))
    flag('warn','Application-level append-only will not satisfy an auditor',
      'In PostgreSQL a table owner is always treated as holding all grant options, so an append-only trigger constrains application bugs, not privileged people.',
      'Ship audit records to storage controlled by a different set of credentials. That is the control that survives the question “who could have altered this?”.');

  if (H('C1','natid'))
    flag('warn','A national ID or licence number is an identifier, not a credential',
      'These numbers are widely known, often printed on documents, and cannot be rotated when they leak. Using one as the login handle means the account name is public and permanent.',
      'Store it as a verified attribute with its own access controls, and issue a separate account identifier. The US federal rule for driver logs takes exactly this position: the record is anchored to the licence, but the licence number must not be the account identifier.');

  if (H('A3','unsure'))
    flag('warn','Multi-tenancy is still undecided',
      'This is the one decision that is genuinely expensive to reverse: adding a tenant column to a live schema means touching every table, every index, every query and every cached decision.',
      'Add tenant_id everywhere now, even at one tenant. It costs a column today and saves a quarter later.');

  if (H('A2','minor') && !q('J6'))
    flag('warn','Under-18 users, with no stated approach to children’s data',
      'Almost every regime imposes additional conditions for children — a lower age of consent, verifiable parental consent, restrictions on profiling.',
      'Decide now whether you block, obtain verifiable parental consent, or rely on an institution’s lawful basis. It changes the registration flow and the schema.');

  if (bigScale && H('L1','solo'))
    flag('warn','Data volume and operational capacity are mismatched',
      'You are planning for hundreds of millions to billions of rows with one or two generalist developers and no database specialist.',
      'Reduce the operational surface: one managed database, partitioning from day one, and no additional stores until a measurement forces one. Every extra system costs a person you do not have.');

  if (H('H6','no') && (H('K4','routine')||H('K4','contract')))
    flag('warn','Auditors will ask for access reviews you are not producing',
      'Recertification evidence is a point-in-time snapshot with a signed decision per line. It cannot be reconstructed from live tables afterwards, because the live tables only show the current state.',
      'Run scheduled campaigns that snapshot the grants under review and record an explicit decision and reviewer per line.');

  if (H('E4','pan'))
    flag('warn','Storing card numbers puts your entire environment in scope',
      'Everything that stores, processes or transmits card data — and everything connected to it — falls inside the assessed environment.',
      'Unless you are building a payment processor, use a provider’s hosted fields or tokenisation so the number never reaches your systems. This is the single largest scope reduction available to you.');

  if (!H('E1','delete') && gdprLike)
    flag('warn','No account deletion, under a regime that grants deletion rights',
      'You will receive the request regardless of whether you built the button.',
      'Build the request path even if the outcome is anonymisation rather than destruction. What matters is that the request is received, tracked against its statutory deadline, and answered.');

  if (!H('E1','consent') && ANY('J2','purpose','versioned'))
    flag('warn','Per-purpose consent with no way for a user to withdraw it',
      'Withdrawal must be as easy as giving consent. If consent was collected in a checkbox and withdrawal requires an email to support, that test is not met.',
      'Add a preference centre that writes a withdrawal event to the same log the original consent was written to.');

  if (H('G2','idp') && H('H1','catalog'))
    flag('info','Two sources of truth for roles',
      'Roles arrive from the identity provider and can also be edited in your application. Whichever was changed last wins, and nobody can tell which that was.',
      'Decide which system is authoritative. If it is the identity provider, make in-app roles read-only and record the mapping; if it is your application, stop importing role claims and use the provider for authentication only.');

  if (H('F3','current') && (H('K4','routine')||H('K4','contract')))
    flag('bad','You will be asked to reconstruct a past state you are not recording',
      '“Who managed this branch in March?” cannot be answered from current-state tables, and the history you did not record cannot be recovered later.',
      'Add validity periods to assignments, memberships and edges now. This is the least reversible omission in the whole design.');

  if (offline && scopedPerms)
    flag('info','Offline clients need permissions that can go stale safely',
      'A cached permission set is a decision made at a past moment. Without a version stamp you cannot tell how stale it is, and a revocation may never reach the device.',
      'Stamp every cached decision with a permissions version and a fetch time, enforce a maximum staleness, and re-check dangerous actions online before allowing them.');

  if ((A.C8||[]).length>6)
    flag('info','You are collecting a lot of personal data',
      'Every attribute here is something you must secure, retain to a schedule, disclose on request, and report if breached. The cheapest personal data to protect is the kind you never collected.',
      'For each attribute, name the specific feature that reads it today. Anything you cannot name, remove from the schema before launch.');

  if (H('C9','exact') && !H('A5','child') && !H('A1','fintech') && !H('A1','health'))
    flag('info','An exact date of birth where an age band would do',
      'A birth date is a strong identifier and a common knowledge-based-authentication answer. An age band answers most product questions and identifies nobody.',
      'Verify once, store the band, discard the date — unless a rule genuinely depends on the exact day.');

  /* ---- universal checklist ---------------------------------------- */
  chk('core.principal','One table for every kind of actor — customers, staff, service accounts. Separate tables for “users” and “admins” is the mistake that makes cross-cutting queries and audit impossible.','identity');
  chk('Account status as an enum, not a boolean','Pending verification, active, suspended, locked, deprovisioned and anonymised are six different states with six different behaviours. is_active collapses them and loses the reason.','identity');
  chk('core.identity_link','One row per external identity, unique on (issuer, subject). Never join federated identities on email — email is mutable and reassignable, and the issuer-plus-subject pair is the only stable key.','identity');
  chk('Partial unique index on the login handle','Unique where the account is not anonymised, so a closed account does not reserve an address forever and a returning customer can register again.','identity');
  if (multiTenant) chk('core.invitation','Invitations are their own object with an expiry, a single-use token hash, an issuer and a scope. Not a user row in a pending state.','identity');
  chk('core.effective_permissions(principal, scope, at)','One function that resolves grants, role inheritance, scope inheritance and denies. Every call site uses it. The moment two code paths compute permissions differently, they disagree, and the disagreement is a vulnerability.','authz');

  return {recs:R, flags:F, checks:C};
}
/* =====================================================================
   UI. In-memory state only: nothing is written to browser storage and
   nothing leaves the page. Use Save / Load to persist your answers.
   ===================================================================== */
const A  = {};   // answers        qid -> value | [values]
const AO = {};   // "other" text   qid -> string
const AN = {};   // notes          qid -> string
let   cur = 0;   // current section index
let   flagMissing = false;

const OTHER = '__other';
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el  = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };

const visible   = qq => !qq.when || !!qq.when(A);
const visibleQs = ()  => QUESTIONS.filter(visible);
const secQs     = sid => QUESTIONS.filter(qq => qq.s===sid && visible(qq));
const answered  = qq => {
  const v=A[qq.id];
  if (v==null) return false;
  if (Array.isArray(v)) { if(!v.length) return false; return !v.includes(OTHER) || !!(AO[qq.id]||'').trim(); }
  return v!==OTHER || !!(AO[qq.id]||'').trim();
};
const liveSections = () => SECTIONS.filter(s => secQs(s.id).length>0);

/* -------------------------------------------------- section nav */
function renderNav(){
  const ol = document.getElementById('secnav');
  ol.innerHTML='';
  const live = liveSections();
  live.forEach((s,i)=>{
    const qs = secQs(s.id), done = qs.filter(answered).length;
    const li = el('li');
    const b  = el('button','' + (i===cur?'active ':'') + (done===qs.length&&qs.length?'done':''),
      '<span class="dot"></span><span>'+esc(s.name)+'</span><span class="qn">'+done+'/'+qs.length+'</span>');
    b.onclick = ()=>{ cur=i; draw(); window.scrollTo({top:0,behavior:'smooth'}); };
    li.appendChild(b); ol.appendChild(li);
  });
  const vq = visibleQs(), done = vq.filter(answered).length;
  document.getElementById('progbar').style.width = (vq.length? (100*done/vq.length):0)+'%';
}

/* -------------------------------------------------- one question */
function renderQ(qq){
  const wrap = el('div','q'+(answered(qq)?'':' unanswered')+(flagMissing&&!answered(qq)?' flagged':''));
  wrap.id = 'q-'+qq.id;
  const head = el('div','q-head');
  head.appendChild(el('span','q-id',esc(qq.id)));
  const tw = el('div');
  tw.appendChild(el('p','q-text', esc(qq.t) + (qq.type==='many'?'<span class="q-meta">select all</span>':'')));
  if (qq.help) tw.appendChild(el('p','q-help', qq.help));
  head.appendChild(tw);
  wrap.appendChild(head);

  const opts = el('div','opts');
  const all = qq.opts.concat([{v:OTHER,l:'Other — specify',s:'Your situation is not on this list. Describe it; it is recorded in the brief and flagged for a human decision.'}]);
  all.forEach(o=>{
    const sel = qq.type==='many' ? (A[qq.id]||[]).includes(o.v) : A[qq.id]===o.v;
    const lab = el('label','opt'+(sel?' sel':''));
    const inp = el('input');
    inp.type = qq.type==='many'?'checkbox':'radio';
    inp.name = qq.id; inp.checked = sel;
    inp.onchange = ()=>{
      if (qq.type==='many'){
        let v = (A[qq.id]||[]).slice();
        if (inp.checked){
          // "none"-style exclusive options clear the rest, and vice versa
          const excl = ['none','na'];
          if (excl.includes(o.v)) v=[o.v];
          else v = v.filter(x=>!excl.includes(x)).concat([o.v]);
        } else v = v.filter(x=>x!==o.v);
        A[qq.id]=v;
      } else A[qq.id]=o.v;
      flagMissing=false; draw();
    };
    lab.appendChild(inp);
    lab.appendChild(el('span','lab', esc(o.l) + (o.s?'<span class="sub">'+o.s+'</span>':'')));
    opts.appendChild(lab);
  });
  wrap.appendChild(opts);

  const showOther = qq.type==='many' ? (A[qq.id]||[]).includes(OTHER) : A[qq.id]===OTHER;
  const ob = el('div','otherbox'+(showOther?' on':''));
  ob.innerHTML = '<label>Describe your case</label>';
  const ta = el('textarea'); ta.rows=2; ta.value = AO[qq.id]||'';
  ta.placeholder = 'Be specific. This text is carried into the brief verbatim.';
  ta.oninput = ()=>{ AO[qq.id]=ta.value; renderNav(); };
  ob.appendChild(ta); wrap.appendChild(ob);

  const nb = el('details','notebox');
  nb.innerHTML = '<summary>Add a note or constraint for this question</summary>';
  const nt = el('textarea'); nt.value = AN[qq.id]||'';
  nt.placeholder = 'Context, exceptions, decisions already taken, people to consult.';
  nt.oninput = ()=>{ AN[qq.id]=nt.value; };
  nb.appendChild(nt); wrap.appendChild(nb);

  if (qq.inline){ const w = qq.inline(A); if (w) wrap.appendChild(el('div','inline-warn', w)); }
  return wrap;
}

/* -------------------------------------------------- draw */
function draw(){
  document.getElementById('report').classList.add('hide');
  const quiz = document.getElementById('quiz');
  quiz.classList.remove('hide');
  quiz.innerHTML='';
  const live = liveSections();
  if (cur>=live.length) cur = live.length-1;
  const s = live[cur];
  const card = el('div','card');
  card.appendChild(el('p','sec-kicker','Section '+(cur+1)+' of '+live.length));
  card.appendChild(el('h2','sec-h', esc(s.name)));
  card.appendChild(el('p','sec-lede', esc(s.lede)));
  secQs(s.id).forEach(qq => card.appendChild(renderQ(qq)));

  const nav = el('div','navbtns noprint');
  const back = el('button','btn','&larr; Back'); back.disabled = cur===0;
  back.onclick = ()=>{ cur--; draw(); window.scrollTo({top:0}); };
  const fwd = el('button','btn primary', cur===live.length-1 ? 'Generate recommendation &rarr;' : 'Next &rarr;');
  fwd.onclick = ()=>{ if (cur===live.length-1) buildReport(); else { cur++; draw(); window.scrollTo({top:0}); } };
  nav.appendChild(back); nav.appendChild(fwd);
  card.appendChild(nav);
  quiz.appendChild(card);
  renderNav();
}

/* -------------------------------------------------- report */
function labelFor(qq,v){
  if (v===OTHER) return 'Other — '+(AO[qq.id]||'(not described)');
  const o = qq.opts.find(x=>x.v===v);
  return o?o.l:v;
}
function answerText(qq){
  const v=A[qq.id];
  if (v==null||(Array.isArray(v)&&!v.length)) return '—';
  return Array.isArray(v) ? v.map(x=>labelFor(qq,x)).join('; ') : labelFor(qq,v);
}

function buildReport(){
  const missing = visibleQs().filter(qq=>qq.req && !answered(qq));
  if (missing.length){
    flagMissing = true;
    const live = liveSections();
    const first = missing[0];
    cur = live.findIndex(s=>s.id===first.s);
    draw();
    const node = document.getElementById('q-'+first.id);
    if (node) node.scrollIntoView({behavior:'smooth',block:'center'});
    alert(missing.length+' question'+(missing.length===1?' is':'s are')+' still unanswered. The first one is highlighted.\n\nEvery recommendation is derived from an answer, so a partial questionnaire produces a partial and possibly wrong stack.');
    return;
  }
  const out = recommend(A);
  const r = document.getElementById('report');
  document.getElementById('quiz').classList.add('hide');
  r.classList.remove('hide');
  r.innerHTML='';

  const hero = el('div','rep-hero');
  hero.innerHTML = '<h2>Recommended design and stack</h2><p>Derived from '+visibleQs().length+' answered questions by '+out.recs.length+' rules. Each recommendation gives one primary choice, one alternative, and the condition under which you should switch. Nothing here is a preference: if a line has no source, treat it as unsupported and challenge it.</p>';
  r.appendChild(hero);

  /* --- flags first: they change what the recommendations mean --- */
  if (out.flags.length){
    const c = el('div','card');
    const bad = out.flags.filter(f=>f.sev==='bad').length;
    c.appendChild(el('h3','sec-h','Conflicts and risks in your answers'));
    c.appendChild(el('p','sec-lede', bad ? bad+' of these are direct contradictions: two of your answers cannot both be satisfied. Resolve those before designing anything.' : 'No direct contradictions. The items below are risks worth a deliberate decision.'));
    const g = el('div','flags');
    ['bad','warn','info'].forEach(sev=>out.flags.filter(f=>f.sev===sev).forEach(f=>{
      const d = el('div','flag '+sev);
      d.innerHTML = '<b>'+({bad:'Contradiction',warn:'Risk',info:'Consider'})[sev]+' — '+f.title+'</b>'+f.body+'<span class="fix"><b>What to do:</b> '+f.fix+'</span>';
      g.appendChild(d);
    }));
    c.appendChild(g); r.appendChild(c);
  }

  /* --- recommendations --- */
  const rc = el('div','card');
  rc.appendChild(el('h3','sec-h','The stack'));
  rc.appendChild(el('p','sec-lede','Primary, alternative, and the trigger that should make you change your mind.'));
  const grid = el('div','stack-grid');
  out.recs.forEach((x,i)=>{
    const box = el('div','rec');
    const h = el('div','rec-h');
    h.innerHTML = '<span class="n">'+String(i+1).padStart(2,'0')+'</span><h3>'+esc(x.area)+'</h3>';
    box.appendChild(h);
    const b = el('div','rec-b');
    b.innerHTML =
      '<div class="rec-row"><span class="pill p">Primary</span><div class="v"><span class="hd">'+x.p.n+'</span>'+(x.p.d||'')+'</div></div>'+
      '<div class="rec-row"><span class="pill a">Alternative</span><div class="v"><span class="hd">'+x.a.n+'</span>'+(x.a.d||'')+'</div></div>'+
      '<div class="rec-row"><span class="pill t">Switch when</span><div class="v">'+x.t+'</div></div>'+
      '<div class="why"><span class="lbl">Why this, from your answers</span><ul>'+x.why.map(w=>'<li>'+w+'</li>').join('')+'</ul>'+
      (x.cite&&x.cite.length ? x.cite.map(c=>'<div class="cite"><b>Source:</b> '+c+'</div>').join('') : '<div class="cite"><b>No source recorded — treat this line as unsupported.</b></div>')+
      '</div>';
    box.appendChild(b); grid.appendChild(box);
  });
  rc.appendChild(grid); r.appendChild(rc);

  /* --- schema checklist --- */
  const cc = el('div','card');
  cc.appendChild(el('h3','sec-h','What your schema must contain'));
  cc.appendChild(el('p','sec-lede','Derived from your answers. Each of these exists because you said something that requires it — not as a general best-practice list.'));
  const groups = {identity:'Identity and accounts',authz:'Roles and permissions',org:'Organisation structure',privacy:'Privacy and consent',audit:'Audit and evidence',tenancy:'Tenancy'};
  Object.keys(groups).forEach(g=>{
    const items = out.checks.filter(c=>c.g===g);
    if(!items.length) return;
    cc.appendChild(el('h4','',esc(groups[g])));
    const ul = el('ul','chk');
    items.forEach(it=>ul.appendChild(el('li','','<span class="m">&#9633;</span><span><b>'+it.m+'</b><span class="d">'+it.d+'</span></span>')));
    cc.appendChild(ul);
  });
  r.appendChild(cc);

  /* --- answer appendix --- */
  const ac = el('div','card');
  ac.appendChild(el('h3','sec-h','Your answers'));
  ac.appendChild(el('p','sec-lede','The complete input to every rule above. Keep this with the design document; when someone asks why the database looks like this, this table is the answer.'));
  const tb = el('table','ans');
  tb.innerHTML = '<thead><tr><th>#</th><th>Question</th><th>Answer</th><th>Note</th></tr></thead>';
  const tbody = el('tbody');
  visibleQs().forEach(qq=>{
    const tr = el('tr');
    tr.innerHTML = '<td class="k">'+esc(qq.id)+'</td><td>'+esc(qq.t)+'</td><td>'+esc(answerText(qq))+'</td><td class="muted">'+esc(AN[qq.id]||'')+'</td>';
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody); ac.appendChild(tb); r.appendChild(ac);

  const back = el('div','navbtns noprint');
  const b1 = el('button','btn','&larr; Back to the questions'); b1.onclick=()=>{ draw(); window.scrollTo({top:0}); };
  const b2 = el('button','btn primary','Print or save as PDF'); b2.onclick=()=>window.print();
  back.appendChild(b1); back.appendChild(b2);
  r.appendChild(back);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* -------------------------------------------------- import / export */
function download(name, text, mime){
  const blob = new Blob([text], {type:mime||'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function toMarkdown(){
  const out = recommend(A);
  const L = [];
  L.push('# Database design brief','');
  L.push('Generated from the requirements questionnaire. '+visibleQs().length+' questions answered.','');
  if (out.flags.length){
    L.push('## Conflicts and risks','');
    out.flags.forEach(f=>{
      L.push('### ['+({bad:'CONTRADICTION',warn:'RISK',info:'CONSIDER'})[f.sev]+'] '+f.title);
      L.push('', f.body.replace(/<[^>]+>/g,''), '', '**What to do:** '+f.fix.replace(/<[^>]+>/g,''), '');
    });
  }
  L.push('## Recommended stack','');
  out.recs.forEach((x,i)=>{
    L.push('### '+(i+1)+'. '+x.area,'');
    L.push('- **Primary:** '+x.p.n+' — '+(x.p.d||'').replace(/<[^>]+>/g,''));
    L.push('- **Alternative:** '+x.a.n+' — '+(x.a.d||'').replace(/<[^>]+>/g,''));
    L.push('- **Switch when:** '+x.t.replace(/<[^>]+>/g,''),'');
    L.push('**Why, from your answers:**','');
    x.why.forEach(w=>L.push('- '+w.replace(/<[^>]+>/g,'')));
    L.push('');
    (x.cite||[]).forEach(c=>L.push('> Source: '+c.replace(/<[^>]+>/g,'')));
    L.push('');
  });
  L.push('## Schema checklist','');
  out.checks.forEach(c=>L.push('- [ ] **'+c.m+'** — '+c.d.replace(/<[^>]+>/g,'')));
  L.push('','## Answers','','| # | Question | Answer | Note |','|---|---|---|---|');
  visibleQs().forEach(qq=>L.push('| '+qq.id+' | '+qq.t.replace(/\|/g,'/')+' | '+answerText(qq).replace(/\|/g,'/')+' | '+(AN[qq.id]||'').replace(/\|/g,'/').replace(/\n/g,' ')+' |'));
  return L.join('\n');
}

document.getElementById('btn-save').onclick = ()=>
  download('db-questionnaire-answers.json', JSON.stringify({version:1, answers:A, other:AO, notes:AN}, null, 2), 'application/json');

document.getElementById('btn-md').onclick = ()=>{
  const missing = visibleQs().filter(qq=>qq.req && !answered(qq));
  if (missing.length && !confirm(missing.length+' questions are unanswered. Export the brief anyway?')) return;
  download('database-design-brief.md', toMarkdown(), 'text/markdown;charset=utf-8');
};

document.getElementById('btn-load').onclick = ()=> document.getElementById('file-in').click();
document.getElementById('file-in').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      Object.keys(A).forEach(k=>delete A[k]); Object.keys(AO).forEach(k=>delete AO[k]); Object.keys(AN).forEach(k=>delete AN[k]);
      Object.assign(A, d.answers||{}); Object.assign(AO, d.other||{}); Object.assign(AN, d.notes||{});
      cur=0; flagMissing=false; draw();
    }catch(err){ alert('That file could not be read as saved answers.'); }
    e.target.value='';
  };
  fr.readAsText(f);
};

document.getElementById('btn-report').onclick = buildReport;
draw();
